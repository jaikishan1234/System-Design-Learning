<!DOCTYPE html>
<html>
<head>
    <title>Clickjacking IFrame</title>
</head>

<body>
    <h1>Child IFrame</h1>

    <p>
        Iframe: Click the button below to see a simple clickjacking demonstration.
    </p>

    <button
        style="background-color: red;"
        onclick="alert('clicked iframe')"
    >
        Click Me!
    </button>
</body>
</html>
